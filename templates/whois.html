<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHOIS Lookup</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌐 WHOIS Lookup</h1>

    <p class="subtitle">
        Get domain registration information instantly.
    </p>

    <form method="POST">

        <input
            type="text"
            name="domain"
            placeholder="example.com"
            required
        >

        <button type="submit">
            🔍 Lookup
        </button>

    </form>

    {% if result %}

    <div class="result-card">

        <h2>WHOIS Result</h2>

        <pre>{{ result }}</pre>

    </div>

    {% endif %}

    <br>

    <a href="/dashboard">
        <button>⬅ Back to Dashboard</button>
    </a>

</div>

</body>
</html>
