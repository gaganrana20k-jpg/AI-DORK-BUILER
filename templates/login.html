<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-container">

        <img src="{{ url_for('static', filename='hacker.png') }}"
             class="hacker"
             alt="Hacker">

        <div class="login-box">

            <h1>Login</h1>

            <form method="POST">

                <input type="email"
                       name="email"
                       placeholder="Email"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 AI Dork Builder</p>
</footer>

</body>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<footer>
    <p>© 2026 AI Dork Builder</p>
</footer>

</body>
